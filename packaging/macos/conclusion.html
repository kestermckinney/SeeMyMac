<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  :root { color-scheme: light dark; }
  body { font: 13px -apple-system, "Helvetica Neue", sans-serif; line-height: 1.5; color: #1F2328; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .rule { width: 40px; height: 3px; border-radius: 2px; background: #3FB950; margin: 0 0 14px; }
  code { font: 12px ui-monospace, Menlo, monospace; }
  @media (prefers-color-scheme: dark) { body { color: #E6EDF3; } }
</style>
</head>
<body>
<h1>SeeMyMac is installed</h1>
<div class="rule"></div>
<p>Open <b>SeeMyMac</b> from <code>~/Applications</code>, Spotlight or Launchpad.</p>
<p>New versions download and install from inside the app, so you will not need this installer
again.</p>
</body>
</html>
