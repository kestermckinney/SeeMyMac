      <stop offset="1" stop-color="#010409"/>
    </radialGradient>
  </defs>
  <circle cx="8" cy="432" r="176" fill="url(#disc)"/>
  <circle cx="8" cy="432" r="176" fill="none" stroke="#2F6FEB" stroke-width="3"/>
  <circle cx="8" cy="432" r="150" fill="none" stroke="#6CA4FF" stroke-opacity="0.22" stroke-width="1"/>
  <circle cx="8" cy="432" r="124" fill="none" stroke="#6CA4FF" stroke-opacity="0.14" stroke-width="1"/>
