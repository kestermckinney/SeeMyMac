stages: [build, prepare, publish]

variables:
  FLATPAK_REPO_URL: "https://kestermckinney.gitlab.io/SeeMyMac/flatpak/"
  DISABLE_ROFILES_FUSE: "1"
  USE_BUILDER_FLATPAK: "0"

# Serialize export and publication jobs; publication also rejects downgrades.
flatpak-release:
  stage: build
  image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
  resource_group: flatpak-release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - bash packaging/gitlab/build-release.sh
  artifacts:
    paths:
      - public/
      - packaging/linux/SeeMyMac.flatpak
      - packaging/linux/seemymac.flatpakrepo
    expire_in: 1 week

# One installer for ARM64 and x86 PCs, on GitLab's hosted Windows runners.
windows-installer:
  stage: build
  tags: [saas-windows-medium-amd64]
  # Two optimized builds (ARM64 and x86) take about 45 minutes each on this runner.
  timeout: 3h
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - powershell -NoProfile -ExecutionPolicy Bypass -File packaging/gitlab/build-windows.ps1
  artifacts:
    paths:
      - target/installers/SeeMyMac-*-setup.exe
    expire_in: 1 week

# Signed and notarized universal app and installer, on the maintainer's own Mac (a
# self-managed shell runner tagged "macos"; see packaging/gitlab/RELEASING-INSTALLERS.md).
# Signing uses that Mac's keychain, so no Apple credentials are stored in GitLab.
macos-installer:
  stage: build
  tags: [macos]
  resource_group: macos-signing
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - export PATH="$HOME/.cargo/bin:/opt/homebrew/bin:/usr/local/bin:$PATH"
    - version="$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' Cargo.toml | head -n1)"
    - '[ "$CI_COMMIT_TAG" = "v$version" ] || { echo "Tag does not match Cargo.toml version $version"; exit 1; }'
    # Only needed when the runner runs while you are logged out (the login keychain is locked).
    - 'if [ -n "${MACOS_KEYCHAIN_PASSWORD:-}" ]; then security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" login.keychain-db; fi'
    - bash packaging/macos/build_app.sh --all
  artifacts:
    paths:
      - target/macos/SeeMyMac-*-macOS.zip
      - target/macos/SeeMyMac-*-macOS.pkg
    expire_in: 1 week

prepare-release:
  stage: prepare
  image: python:3.14-alpine
  needs: [flatpak-release, windows-installer, macos-installer]
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - python3 packaging/gitlab/publish-release.py

publish-release:
  stage: publish
  image: python:3.14-alpine
  needs: [flatpak-release, prepare-release]
  resource_group: flatpak-release
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
      when: manual
  script:
    - python3 packaging/gitlab/publish-release.py --publish
  pages:
    publish: public
    expire_in: never

# Deploy a locally built and signed repository without publishing the release.
# The checksum is passed by the maintainer who uploaded this immutable package.
deploy-prepared-repository:
  stage: publish
  image: alpine:3.22
  resource_group: flatpak-release
  rules:
    - if: '$CI_PIPELINE_SOURCE == "api" && $REPOSITORY_PACKAGE_VERSION && $REPOSITORY_PACKAGE_SHA256'
  script:
    - apk add --no-cache curl
    - curl --fail --location --output repository.tar.gz "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/seemymac/$REPOSITORY_PACKAGE_VERSION/repository.tar.gz"
    - printf '%s  repository.tar.gz\n' "$REPOSITORY_PACKAGE_SHA256" | sha256sum -c -
    - mkdir public
    - tar -xzf repository.tar.gz -C public
    - test -s public/flatpak/summary
    - test -s public/flatpak/summary.sig
  pages:
    publish: public
    expire_in: never
