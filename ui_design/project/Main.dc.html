<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remote desktop session</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 100%; height: 900px; display: flex; flex-direction: column; position: relative; overflow: hidden; background: #0D1117; color: #E6EDF3; font-family: Inter, system-ui, sans-serif; font-size: 13px">

<sc-if value="{{ windowed }}" hint-placeholder-val="{{ true }}">
<div style="height: 32px; flex-shrink: 0; display: flex; align-items: center; background: #010409; border-bottom: 1px solid #262C36; color: #C9D1D9; font-size: 12px">
  <span style="flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; padding: 0 12px; white-space: nowrap; overflow: hidden">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#6CA4FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
    <span style="overflow: hidden; text-overflow: ellipsis">{{ windowTitle }}</span>
  </span>
  <button aria-label="Minimize window" style="width: 46px; height: 32px; display: grid; place-items: center; border: 0; background: transparent; color: #C9D1D9; cursor: pointer">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M5 12h14"></path></svg>
  </button>
  <button aria-label="Maximize window" style="width: 46px; height: 32px; display: grid; place-items: center; border: 0; background: transparent; color: #C9D1D9; cursor: pointer">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><rect x="5" y="5" width="14" height="14" rx="1"></rect></svg>
  </button>
  <button aria-label="Close window" style="width: 46px; height: 32px; display: grid; place-items: center; border: 0; background: transparent; color: #C9D1D9; cursor: pointer">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
  </button>
</div>
</sc-if>

<sc-if value="{{ pinned }}" hint-placeholder-val="{{ true }}">
<header style="height: 40px; flex-shrink: 0; display: flex; align-items: center; gap: 4px; padding: 0 6px; background: #0D1117; border-bottom: 1px solid #262C36; position: relative; z-index: 3">
  <button onClick="{{ toggleMenu }}" aria-haspopup="menu" aria-expanded="{{ menuExpanded }}" style="height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border: 0; border-radius: 6px; background: {{ menuBtnBg }}; color: #E6EDF3; font: inherit; font-weight: 600; cursor: pointer; flex-shrink: 0">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
    <span>Connections</span>
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
  </button>
  <div style="width: 1px; height: 20px; background: #262C36; margin: 0 4px; flex-shrink: 0"></div>
  <nav aria-label="Active sessions" style="display: flex; align-items: center; gap: 2px; flex: 1; min-width: 0; overflow-x: auto">
    <sc-for list="{{ sessions }}" as="s" hint-placeholder-count="3">
      <div style="height: 32px; display: flex; align-items: center; border-radius: 6px; background: {{ s.bg }}; box-shadow: inset 0 -2px 0 {{ s.underline }}; flex-shrink: 0">
        <button onClick="{{ s.select }}" aria-current="{{ s.current }}" style="height: 32px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 10px; border: 0; background: transparent; color: {{ s.color }}; font: inherit; font-weight: 500; cursor: pointer; white-space: nowrap">
          <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{ s.dot }}"></span>
          <span>{{ s.name }}</span>
        </button>
        <button onClick="{{ s.close }}" aria-label="Disconnect {{ s.name }}" style="width: 24px; height: 24px; margin-right: 4px; display: grid; place-items: center; border: 0; border-radius: 4px; background: transparent; color: #9198A1; cursor: pointer">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg>
        </button>
      </div>
    </sc-for>
    <button onClick="{{ newConn }}" aria-label="New connection" style="width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: #9198A1; cursor: pointer; flex-shrink: 0">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </nav>
  <sc-if value="{{ multiMon }}" hint-placeholder-val="{{ true }}">
    <div role="radiogroup" aria-label="Remote monitor" style="height: 32px; display: flex; align-items: center; gap: 2px; padding: 2px; border: 1px solid #262C36; border-radius: 6px; flex-shrink: 0">
      <sc-for list="{{ monBtns }}" as="m" hint-placeholder-count="3">
        <button role="radio" aria-checked="{{ m.checked }}" onClick="{{ m.pick }}" title="{{ m.title }}" style="height: 26px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 0; border-radius: 4px; background: {{ m.bg }}; color: {{ m.color }}; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer">
          <sc-if value="{{ m.isAll }}" hint-placeholder-val="{{ false }}">
            <svg width="16" height="14" viewBox="0 0 28 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="11" height="9" rx="1.5"></rect><rect x="15" y="5" width="11" height="9" rx="1.5"></rect><path d="M7.5 14v4M20.5 14v4M5 18h18"></path></svg>
          </sc-if>
          <sc-if value="{{ m.isOne }}" hint-placeholder-val="{{ true }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"></rect><path d="M8 20h8M12 16v4"></path></svg>
          </sc-if>
          <span>{{ m.label }}</span>
        </button>
      </sc-for>
    </div>
  </sc-if>
  <span style="color: #9198A1; padding: 0 8px; white-space: nowrap; flex-shrink: 0">{{ resLabel }}</span>
  <div style="display: flex; align-items: center; gap: 2px; flex-shrink: 0">
    <button onClick="{{ openSwitcher }}" aria-label="Switch session (Ctrl+Alt+Tab)" title="Switch session" style="width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: #C9D1D9; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1"></rect><rect x="14" y="3" width="7" height="7" rx="1"></rect><rect x="3" y="14" width="7" height="7" rx="1"></rect><rect x="14" y="14" width="7" height="7" rx="1"></rect></svg>
    </button>
    <button aria-label="Send Ctrl+Alt+Del" title="Send Ctrl+Alt+Del" style="width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: #C9D1D9; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="2" y="6" width="20" height="12" rx="2"></rect><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"></path></svg>
    </button>
    <button aria-label="Scale to fit window" title="Scale: fit window" style="width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: #C9D1D9; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>
    </button>
    <button onClick="{{ togglePin }}" aria-label="Unpin toolbar (auto-hide)" title="Unpin toolbar" aria-pressed="true" style="width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 6px; background: #1F2630; color: #6CA4FF; cursor: pointer">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5M9 3h6l-1 6 3 3v2H7v-2l3-3z"></path></svg>
    </button>
    <button onClick="{{ toggleFull }}" aria-label="{{ fullLabel }}" title="{{ fullLabel }}" style="height: 32px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border: 0; border-radius: 6px; background: {{ fullBg }}; color: {{ fullColor }}; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer">
      <sc-if value="{{ windowed }}" hint-placeholder-val="{{ true }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"></path></svg>
      </sc-if>
      <sc-if value="{{ full }}" hint-placeholder-val="{{ false }}">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v3a2 2 0 0 1-2 2H3M21 8h-3a2 2 0 0 1-2-2V3M3 16h3a2 2 0 0 1 2 2v3M16 21v-3a2 2 0 0 1 2-2h3"></path></svg>
        <span>Exit full screen</span>
      </sc-if>
    </button>
  </div>
</header>
</sc-if>

<main aria-label="Remote screen" style="flex: 1; min-height: 0; position: relative; overflow: hidden; background: {{ mainBg }}">
  <sc-if value="{{ hasActive }}" hint-placeholder-val="{{ true }}">
   <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; gap: {{ screensGap }}; padding: {{ screensPad }}">
   <sc-for list="{{ screens }}" as="sc" hint-placeholder-count="1">
   <div style="position: relative; overflow: hidden; min-width: 0; flex-shrink: 1; width: {{ sc.w }}; height: {{ sc.h }}; aspect-ratio: {{ sc.ar }}; background: {{ sc.wall }}; border-radius: {{ sc.radius }}; box-shadow: {{ sc.ring }}">
    <div style="position: absolute; top: 6%; left: 7%; right: 7%; bottom: {{ sc.winBottom }}; display: flex; flex-direction: column; background: #F3F4F6; border-radius: 6px; overflow: hidden; box-shadow: 0 12px 40px rgba(0,0,0,0.35); color: #1F2328">
      <div style="height: 34px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; background: #FFFFFF; border-bottom: 1px solid #D0D7DE; font-size: 12px">
        <span style="font-weight: 600">{{ sc.app }}</span>
        <span aria-hidden="true" style="display: flex; gap: 18px; color: #57606A">— ☐ ✕</span>
      </div>
      <div style="flex: 1; min-height: 0; display: flex">
        <div style="width: 200px; flex-shrink: 0; padding: 16px 12px; display: flex; flex-direction: column; gap: 12px; background: #E9ECEF">
          <sc-for list="{{ sideItems }}" as="r" hint-placeholder-count="7">
            <div style="height: 10px; width: {{ r.w }}; border-radius: 3px; background: #C3CAD3"></div>
          </sc-for>
        </div>
        <div style="flex: 1; min-width: 0; padding: 20px; display: flex; flex-direction: column; gap: 16px">
          <div style="height: 14px; width: 30%; border-radius: 3px; background: #9AA4B2"></div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
            <sc-for list="{{ cards }}" as="c" hint-placeholder-count="3">
              <div style="height: 84px; border-radius: 6px; background: #FFFFFF; border: 1px solid #D0D7DE; padding: 12px; display: flex; flex-direction: column; gap: 10px">
                <div style="height: 8px; width: 50%; border-radius: 3px; background: #C3CAD3"></div>
                <div style="height: 18px; width: 35%; border-radius: 3px; background: {{ sc.accent }}"></div>
              </div>
            </sc-for>
          </div>
          <div style="flex: 1; min-height: 0; border-radius: 6px; background: #FFFFFF; border: 1px solid #D0D7DE; padding: 12px; display: flex; flex-direction: column; gap: 14px; overflow: hidden">
            <sc-for list="{{ tableRows }}" as="t" hint-placeholder-count="8">
              <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px">
                <div style="height: 8px; border-radius: 3px; background: #D8DEE4"></div>
                <div style="height: 8px; width: {{ t.w }}; border-radius: 3px; background: #D8DEE4"></div>
                <div style="height: 8px; width: 60%; border-radius: 3px; background: #D8DEE4"></div>
                <div style="height: 8px; width: 40%; border-radius: 3px; background: #D8DEE4"></div>
              </div>
            </sc-for>
          </div>
        </div>
      </div>
    </div>
    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: {{ sc.taskH }}; display: flex; align-items: center; justify-content: center; gap: 8px; background: rgba(0,0,0,0.35)">
      <span style="width: 26px; height: 26px; border-radius: 4px; background: rgba(255,255,255,0.85)"></span>
      <span style="width: 26px; height: 26px; border-radius: 4px; background: rgba(255,255,255,0.35)"></span>
      <span style="width: 26px; height: 26px; border-radius: 4px; background: rgba(255,255,255,0.35)"></span>
      <span style="width: 26px; height: 26px; border-radius: 4px; background: rgba(255,255,255,0.35)"></span>
    </div>
    <sc-if value="{{ sc.showLabel }}" hint-placeholder-val="{{ false }}">
      <button onClick="{{ sc.focus }}" aria-label="Show only monitor {{ sc.num }}" title="Show only this monitor" style="position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: flex-start; padding: 10px; border: 0; background: transparent; font: inherit; cursor: zoom-in">
        <span style="height: 26px; display: flex; align-items: center; gap: 8px; padding: 0 10px; border-radius: 6px; background: rgba(13,17,23,0.9); color: #E6EDF3; font-size: 12px; font-weight: 600">
          <span>Monitor {{ sc.num }}</span>
          <span style="color: #9198A1; font-weight: 400">{{ sc.meta }}</span>
        </span>
      </button>
    </sc-if>
   </div>
   </sc-for>
   </div>
  </sc-if>
  <sc-if value="{{ noActive }}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center">
      <p style="margin: 0; font-size: 18px; font-weight: 600">No active sessions</p>
      <p style="margin: 0; color: #9198A1">Pick a favorite or type a host name to connect.</p>
      <button onClick="{{ toggleMenu }}" style="height: 40px; padding: 0 18px; border: 0; border-radius: 6px; background: #2F6FEB; color: #FFFFFF; font: inherit; font-weight: 600; cursor: pointer">Open connections</button>
    </div>
  </sc-if>

  <sc-if value="{{ unpinned }}" hint-placeholder-val="{{ false }}">
    <button onClick="{{ togglePin }}" aria-label="Show toolbar — {{ remote.name }}" style="position: absolute; top: 0; left: 50%; transform: translateX(-50%); height: 24px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border: 1px solid #30363D; border-top: 0; border-radius: 0 0 8px 8px; background: rgba(13,17,23,0.9); color: #E6EDF3; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; z-index: 4">
      <span aria-hidden="true" style="width: 7px; height: 7px; border-radius: 50%; background: {{ remote.dot }}"></span>
      <span>{{ remote.name }}</span>
      <span style="color: #9198A1">{{ monTabLabel }}</span>
      <span style="color: #9198A1">{{ sessionCountLabel }}</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg>
    </button>
  </sc-if>
</main>

<sc-if value="{{ showMenu }}" hint-placeholder-val="{{ false }}">
  <button onClick="{{ closeAll }}" aria-label="Close menu" style="position: absolute; inset: 0; border: 0; background: transparent; z-index: 4; cursor: default"></button>
  <div role="menu" aria-label="Connections" style="position: absolute; top: 44px; left: 6px; width: 380px; max-width: calc(100% - 12px); max-height: 840px; overflow-y: auto; display: flex; flex-direction: column; background: #161B22; border: 1px solid #30363D; border-radius: 10px; box-shadow: 0 16px 48px rgba(0,0,0,0.5); z-index: 5">
    <div style="padding: 10px; border-bottom: 1px solid #262C36">
      <label for="qc" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Quick connect</label>
      <div style="height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 10px; background: #0D1117; border: 1px solid #2F6FEB; border-radius: 6px">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#9198A1" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
        <input id="qc" type="text" placeholder="Search favorites or enter a host…" style="flex: 1; min-width: 0; height: 32px; border: 0; outline: none; background: transparent; color: #E6EDF3; font: inherit; font-size: 13px">
        <kbd style="font: inherit; font-size: 11px; color: #9198A1; padding: 1px 6px; border: 1px solid #30363D; border-radius: 4px">Enter</kbd>
      </div>
    </div>

    <div style="padding: 8px 6px 4px">
      <p style="margin: 0; padding: 4px 8px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9198A1">Active · {{ sessionCount }}</p>
      <sc-for list="{{ sessions }}" as="s" hint-placeholder-count="3">
        <button role="menuitemradio" aria-checked="{{ s.current }}" onClick="{{ s.selectClose }}" style="width: 100%; height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border: 0; border-radius: 6px; background: {{ s.menuBg }}; color: #E6EDF3; font: inherit; text-align: left; cursor: pointer">
          <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 50%; background: {{ s.dot }}; flex-shrink: 0"></span>
          <span style="flex: 1; min-width: 0; font-weight: 500">{{ s.name }}</span>
          <span style="color: #9198A1; font-size: 12px">{{ s.statusLabel }}</span>
          <kbd style="font: inherit; font-size: 11px; color: #9198A1; width: 54px; text-align: right">{{ s.shortcut }}</kbd>
        </button>
      </sc-for>
    </div>

    <div style="padding: 4px 6px; border-top: 1px solid #262C36">
      <p style="margin: 0; padding: 8px 8px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9198A1">Favorites</p>
      <sc-for list="{{ favorites }}" as="f" hint-placeholder-count="4">
        <div style="display: flex; align-items: center; gap: 2px; border-radius: 6px">
          <button role="menuitem" onClick="{{ f.connect }}" style="flex: 1; min-width: 0; height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: #E6EDF3; font: inherit; text-align: left; cursor: pointer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="#D29922" stroke="#D29922" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1.1 6.2L12 17.3 6.4 20.2l1.1-6.2L3 9.6l6.2-.9z"></path></svg>
            <span style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
              <span style="font-weight: 500">{{ f.name }}</span>
              <span style="font-size: 12px; color: #9198A1">{{ f.host }} · {{ f.proto }}</span>
            </span>
            <sc-if value="{{ f.isOpen }}" hint-placeholder-val="{{ false }}">
              <span style="font-size: 11px; color: #3FB950; font-weight: 500">Open</span>
            </sc-if>
          </button>
          <button onClick="{{ f.edit }}" aria-label="Edit {{ f.name }}" style="width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: #9198A1; cursor: pointer; flex-shrink: 0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg>
          </button>
        </div>
      </sc-for>
    </div>

    <div style="padding: 4px 6px; border-top: 1px solid #262C36">
      <p style="margin: 0; padding: 8px 8px 6px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #9198A1">Recent</p>
      <sc-for list="{{ recent }}" as="f" hint-placeholder-count="2">
        <div style="display: flex; align-items: center; gap: 2px">
          <button role="menuitem" onClick="{{ f.connect }}" style="flex: 1; min-width: 0; height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 8px; border: 0; border-radius: 6px; background: transparent; color: #E6EDF3; font: inherit; text-align: left; cursor: pointer">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9198A1" stroke-width="1.75" stroke-linecap="round" aria-hidden="true" style="flex-shrink: 0"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
            <span style="flex: 1; min-width: 0">{{ f.name }}</span>
            <span style="font-size: 12px; color: #9198A1">{{ f.host }}</span>
          </button>
          <button onClick="{{ f.edit }}" aria-label="Edit {{ f.name }}" style="width: 32px; height: 32px; display: grid; place-items: center; border: 0; border-radius: 6px; background: transparent; color: #9198A1; cursor: pointer; flex-shrink: 0">

    var decorate = function (c) {
      return {
        name: c.name, host: c.host, proto: c.proto,
        isOpen: st.open.indexOf(c.id) >= 0,
        connect: function () { self.connect(c.id); },
        edit: function () { self.setState({ view: 'dialog', editId: c.id, tab: 'general', proto: null }); }
      };
    };

    var act = st.active ? byId[st.active] : null;
    var remote = act
      ? { wall: act.wall, accent: act.accent, app: act.app, name: act.name, dot: act.status === 'ok' ? '#3FB950' : '#D29922' }
      : { wall: '#0D1117', accent: '#30363D', app: '', name: 'No session', dot: '#6E7681' };

    var editing = st.editId ? byId[st.editId] : { name: '', host: '', port: '3389', user: '', group: 'servers', fav: true, proto: 'RDP' };
    var proto = st.proto || editing.proto;
    var tabs = [['general', 'General'], ['display', 'Display'], ['resources', 'Local resources']].map(function (t) {
      var sel = st.tab === t[0];
      return {
        label: t[1], selected: sel ? 'true' : 'false',
        color: sel ? '#E6EDF3' : '#9198A1',
        underline: sel ? '#6CA4FF' : 'transparent',
        pick: function () { self.setState({ tab: t[0] }); }
      };
    });

    var n = st.open.length;
    var monCount = act ? (act.monitors || 1) : 1;
    var mon = act ? (st.mon[act.id] || '1') : '1';
    if (monCount < 2) mon = '1';
    var isAll = mon === 'all';
    var setMon = function (v) {
      var m = Object.assign({}, st.mon);
      m[st.active] = v;
      self.setState({ mon: m });
    };
    var screens = !act ? [] : (isAll ? [1, 2] : [Number(mon)]).map(function (k) {
      return {
        num: k,
        wall: k === 1 ? act.wall : act.wall2,
        accent: k === 1 ? act.accent : act.accent2,
        app: k === 1 ? act.app : act.app2,
        w: isAll ? 'calc(50% - 20px)' : '100%',
        h: isAll ? 'auto' : '100%',
        ar: isAll ? '16 / 9' : 'auto',
        radius: isAll ? '4px' : '0',
        ring: isAll ? '0 0 0 1px #30363D, 0 12px 32px rgba(0,0,0,0.5)' : 'none',
        winBottom: isAll ? '14%' : '72px',
        taskH: isAll ? '10%' : '44px',
        showLabel: isAll,
        meta: k === 1 ? '1920 × 1080 · Primary' : '1920 × 1080',
        focus: function () { setMon(String(k)); }
      };
    });
    var monBtns = [['1', '1', 'Show monitor 1 (Ctrl+Alt+PgUp)'], ['2', '2', 'Show monitor 2 (Ctrl+Alt+PgDn)'], ['all', 'Both', 'Zoom out to see both monitors (Ctrl+Alt+Home)']].map(function (b) {
      var on = mon === b[0];
      return {
        label: b[1], title: b[2], isAll: b[0] === 'all', isOne: b[0] !== 'all',
        checked: on ? 'true' : 'false',
        bg: on ? '#2F6FEB' : 'transparent',
        color: on ? '#FFFFFF' : '#C9D1D9',
        pick: function () { setMon(b[0]); }
      };
    });
    return {
      windowed: !st.full,
      full: st.full,
      windowTitle: act ? act.name + ' — ' + act.host + ' — Remote Desktop' : 'Remote Desktop',
      fullLabel: st.full ? 'Exit full screen (Ctrl+Alt+Enter)' : 'Full screen (Ctrl+Alt+Enter)',
      fullBg: st.full ? '#1F2630' : 'transparent',
      fullColor: st.full ? '#E6EDF3' : '#C9D1D9',
      toggleFull: function () { self.setState({ full: !st.full, pinned: st.full ? st.pinned : false, view: 'idle' }); },
      multiMon: monCount > 1,
      monBtns: monBtns,
      screens: screens,
      mainBg: isAll ? '#05070A' : remote.wall,
      screensGap: isAll ? '16px' : '0',
      screensPad: isAll ? '24px' : '0',
      monTabLabel: monCount > 1 ? (isAll ? '· Both monitors' : '· Monitor ' + mon + ' of 2') : '',
      pinned: st.pinned,
      unpinned: !st.pinned,
      showMenu: st.view === 'menu',
      showSwitcher: st.view === 'switcher',
      showDialog: st.view === 'dialog',
      menuExpanded: st.view === 'menu' ? 'true' : 'false',
      menuBtnBg: st.view === 'menu' ? '#1F2630' : 'transparent',
      sessions: sessions,
      sessionCount: n,
      sessionCountLabel: n > 1 ? '+' + (n - 1) + ' more' : '',
      favorites: all.filter(function (c) { return c.fav; }).map(decorate),
      recent: all.filter(function (c) { return !c.fav; }).map(decorate),
      hasActive: !!act,
      noActive: !act,
      remote: remote,
      resLabel: !act ? '' : (monCount > 1 ? (isAll ? '3840 × 1080 · Fit' : '1920 × 1080') : '1920 × 1080 · Fit'),
      sideItems: [{ w: '80%' }, { w: '65%' }, { w: '72%' }, { w: '55%' }, { w: '78%' }, { w: '60%' }, { w: '68%' }],
      cards: [{}, {}, {}],
      tableRows: [{ w: '70%' }, { w: '55%' }, { w: '80%' }, { w: '62%' }, { w: '75%' }, { w: '50%' }, { w: '68%' }, { w: '58%' }],
      toggleMenu: function () { self.setState({ view: st.view === 'menu' ? 'idle' : 'menu' }); },
      openSwitcher: function () { self.setState({ view: 'switcher' }); },
      closeAll: function () { self.setState({ view: 'idle' }); },
      togglePin: function () { self.setState({ pinned: !st.pinned, view: 'idle' }); },
      newConn: function () { self.setState({ view: 'dialog', editId: null, tab: 'general', proto: null }); },
      saveConnect: function () { if (st.editId) { self.connect(st.editId); } else { self.setState({ view: 'idle' }); } },
      dlgTitle: st.editId ? 'Edit connection — ' + editing.name : 'New connection',
      isEdit: !!st.editId,
      editing: editing,
      dlgTabs: tabs,
      tabGeneral: st.tab === 'general',
      tabDisplay: st.tab === 'display',
      tabResources: st.tab === 'resources',
      protoRdp: proto === 'RDP' ? 'true' : 'false',
      protoVnc: proto === 'VNC' ? 'true' : 'false',
      rdpBg: proto === 'RDP' ? '#2F6FEB' : 'transparent',
      rdpColor: proto === 'RDP' ? '#FFFFFF' : '#9198A1',
      vncBg: proto === 'VNC' ? '#2F6FEB' : 'transparent',
      vncColor: proto === 'VNC' ? '#FFFFFF' : '#9198A1',
      pickRdp: function () { self.setState({ proto: 'RDP' }); },
      pickVnc: function () { self.setState({ proto: 'VNC' }); }
    };
  }
}
</script>
</body>
</html>
