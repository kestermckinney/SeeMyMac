name: Release installers

# Pushing a vX.Y.Z tag builds the Flatpak, Windows and macOS installers and attaches them to a
# GitHub release. Other runs (workflow_dispatch) build and keep the files as workflow artifacts
# but do not create a release.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  flatpak:
    name: Flatpak (Linux)
    # The Flatpak build needs a v* tag (build-flatpak-release.sh checks it), so it skips manual runs.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # flatpak-builder needs bubblewrap and FUSE-free sandboxing from a privileged container.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    timeout-minutes: 120
    env:
      DISABLE_ROFILES_FUSE: '1'
      USE_BUILDER_FLATPAK: '0'
      FLATPAK_GPG_KEY_ID: ${{ secrets.FLATPAK_GPG_KEY_ID }}
      FLATPAK_GPG_PASSPHRASE: ${{ secrets.FLATPAK_GPG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Write the Flatpak signing key
        env:
          KEY: ${{ secrets.FLATPAK_GPG_PRIVATE_KEY }}
        run: |
          test -n "$KEY" || { echo "FLATPAK_GPG_PRIVATE_KEY secret is missing"; exit 1; }
          printf '%s\n' "$KEY" > "$RUNNER_TEMP/flatpak-signing-key.asc"
          echo "FLATPAK_GPG_PRIVATE_KEY=$RUNNER_TEMP/flatpak-signing-key.asc" >> "$GITHUB_ENV"

      - name: Build, sign and bundle
        run: bash packaging/ci/build-flatpak-release.sh

      - name: Stage the Flatpak files
        run: |
          mkdir -p dist/flatpak
          cp packaging/linux/SeeMyMac.flatpak dist/flatpak/

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/flatpak/*
          if-no-files-found: error

      # The signed OSTree repository, with the .flatpakrepo users add and its icon. The pages
      # job publishes it at https://kestermckinney.github.io/SeeMyMac/flatpak/.
      - name: Stage the Flatpak repository
        run: |
          mkdir -p dist/flatpak-repo
          cp -r packaging/linux/flatpak-repo/. dist/flatpak-repo/
          rm -rf dist/flatpak-repo/tmp dist/flatpak-repo/.lock
          cp packaging/linux/seemymac.flatpakrepo dist/flatpak-repo/
          cp assets/icons/seemac.png dist/flatpak-repo/icon.png

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-repo
          path: dist/flatpak-repo/
          if-no-files-found: error

  windows:
    name: Windows installer
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      # Builds the ARM64 and x86 binaries and packs them into SeeMyMac-<version>-setup.exe.
      # Installs Inno Setup, NASM, LLVM and the ARM64 C++ tools on the runner first.
      - name: Build the installer
        shell: pwsh
        run: ./packaging/ci/build-windows.ps1

      - name: Stage the installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/windows | Out-Null
          Copy-Item target/installers/SeeMyMac-*-setup.exe dist/windows/

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/windows/*
          if-no-files-found: error

  macos:
    name: macOS (signed and notarized)
    runs-on: macos-15
    timeout-minutes: 120
    env:
      # Developer ID certificates are imported into a throwaway keychain below.
      SIGN_IDENTITY: 'Developer ID Application: Paul McKinney (2PY624KHXH)'
      INSTALLER_IDENTITY: 'Developer ID Installer: Paul McKinney (2PY624KHXH)'
      TEAM_ID: '2PY624KHXH'
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
      NOTARY_API_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
      NOTARY_API_ISSUER_ID: ${{ secrets.NOTARY_API_ISSUER_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        if: github.ref_type == 'tag'
        run: |
          version="$(sed -n 's/^version = "\([0-9.]*\)"/\1/p' Cargo.toml | head -n1)"
          [ "$GITHUB_REF_NAME" = "v$version" ] || { echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }

      - name: Install the signing certificates into a temporary keychain
        run: |
          set -euo pipefail
          for v in MACOS_CERTIFICATE MACOS_CERTIFICATE_PASSWORD KEYCHAIN_PASSWORD NOTARY_API_KEY NOTARY_API_KEY_ID NOTARY_API_ISSUER_ID; do
            [ -n "${!v}" ] || { echo "Secret $v is missing"; exit 1; }
          done
          keychain="$RUNNER_TEMP/build.keychain-db"
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificates.p12"
          echo "$NOTARY_API_KEY" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "NOTARY_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$RUNNER_TEMP/certificates.p12" -k "$keychain" -P "$MACOS_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild
          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$keychain"
          rm -f "$RUNNER_TEMP/certificates.p12"

      - name: Build, sign, notarize and package
        run: bash packaging/macos/build_app.sh --all

      - name: Stage the macOS files
        run: |
          mkdir -p dist/macos
          cp target/macos/SeeMyMac-*-macOS.zip target/macos/SeeMyMac-*-macOS.pkg dist/macos/

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain-db" || true

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/macos/*
          if-no-files-found: error

  release:
    name: Attach to the GitHub release
    needs: [flatpak, windows, macos]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Named downloads, so the Flatpak repository artifact stays out of the release.
      - uses: actions/download-artifact@v4
        with:
          name: flatpak
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist

      - name: Create the release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l dist
          version="${GITHUB_REF_NAME#v}"
          for f in "dist/SeeMyMac-${version}-setup.exe" "dist/SeeMyMac-${version}-macOS.zip" "dist/SeeMyMac-${version}-macOS.pkg" \
                   dist/SeeMyMac.flatpak; do
            [ -f "$f" ] || { echo "Missing $f"; exit 1; }
          done
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "SeeMyMac ${version}" \
              --notes-file packaging/RELEASE_NOTES.md
          fi

  pages:
    name: Publish the Flatpak repository
    # After the release, so `flatpak update` never offers a version that has no release.
    needs: [release]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # The github-pages environment must allow v* tags (see packaging/RELEASING.md).
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}flatpak/seemymac.flatpakrepo
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flatpak-repo
          path: site/flatpak

      - name: Check the repository
        run: |
          set -euo pipefail
          for f in config summary summary.sig seemymac.flatpakrepo icon.png; do
            [ -s "site/flatpak/$f" ] || { echo "Missing site/flatpak/$f"; exit 1; }
          done

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
